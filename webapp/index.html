<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>کارت شعر</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <header class="page-header">
        <h1>کارت شعر</h1>
    </header>

    <section class="editor">

        <div class="field">
            <label for="poemInput">
                متن شعر
            </label>

            <textarea
                id="poemInput"
                placeholder="شعرت را همین‌جا بنویس..."
                maxlength="3000"
                autocomplete="off"
                spellcheck="false"
            ></textarea>
        </div>


        <div class="field">

            <div class="field-title">
                نوع کارت شعر
            </div>

            <div class="type-options">

                <button
                    type="button"
                    class="type-button active"
                    data-branded="true"
                >
                    🖋️ با امضای شعرکده
                </button>

                <button
                    type="button"
                    class="type-button"
                    data-branded="false"
                >
                    ◻️ کارت عمومی، بدون امضا
                </button>

            </div>

        </div>


        <div class="field">

            <div class="field-title">
                رنگ کارت شعر
            </div>

            <div
                id="paletteButtons"
                class="palette-options"
            ></div>

        </div>

    </section>


    <section class="actions">

        <button
            id="downloadBtn"
            type="button"
            class="action-button"
            disabled
        >
            ⬇️ ذخیره
        </button>

        <button
            id="shareBtn"
            type="button"
            class="action-button"
            disabled
        >
            ↗️ اشتراک‌گذاری
        </button>

    </section>


    <!-- پیش‌نمایش عمداً آخر صفحه است -->
    <section class="preview-section">

        <div
            id="previewEmpty"
            class="preview-empty"
        >
            <div class="preview-icon">🖼️</div>
            <div>پیش‌نمایش کارت شعر</div>
        </div>

        <canvas
            id="poetryCanvas"
            width="1080"
            height="1080"
        ></canvas>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
